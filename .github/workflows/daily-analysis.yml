# ============================================
# A股全自动分析 - GitHub Actions 定时任务
# 每天早 6:00（北京时间）推送一次，内容 = 上一个交易日的收盘复盘
#   UTC 22:00 = 北京时间次日 06:00
#   周日~周五 22:00 UTC → 周一~周六 06:00 北京时间
#   周六早上这一次不能省：没有它，周五的收盘复盘要等到下周一才发，
#   而周六 10:00 的周复盘正好缺周五那天的日报。
# 周一（= 周六那次已推过周五的数据）由 run_daily.py 按数据日期自动跳过发送。
# 整合：基础技术分析 + yyPZ老龙反抽 + 郑希视角研报
# ============================================

name: Daily Stock Analysis

on:
  schedule:
    # UTC 22:00 = 北京时间 06:00（次日）；周日~周五 UTC 对应周一~周六北京时间
    - cron: '0 22 * * 0-5'

  # 支持手动触发
  workflow_dispatch:

  # 推送代码时运行（用于调试）
  push:
    branches:
      - main
    paths:
      - '**.py'
      - 'config.json'
      - 'config.yaml'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # 定时在 22:00 UTC 触发，跑起来时 runner 的 UTC 日期还是「昨天」。
    # 不锁时区的话，python 写的是北京日期、shell 的 date +%F 却是 UTC 日期，
    # 归档时按后者去找文件必然扑空，提交信息里的日期也会差一天。
    env:
      TZ: Asia/Shanghai

    steps:
      - name: 📥 拉取代码（含 .claude/skills 中的郑希数据）
        uses: actions/checkout@v4

      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📊 运行全分析（基础分析 + yyPZ + 郑希研报）
        id: analysis
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          # 定时任务真的推送；改代码顺带触发的那次只生成不推送 ——
          # 推送时段说好了是早上 6 点，晚上改一版排版不该在你手机上也响一声。
          PUSH_DRY_RUN: ${{ github.event_name == 'push' && '1' || '0' }}
        run: python run_daily.py

      - name: 📁 归档报告到仓库
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git config user.name "stock-analyzer[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 文件是按行情数据日期命名的（≈ 昨天），不是运行日期；run_daily.py 把它
          # 透到这一步的 output 里。脚本中途挂了就退回今天，至少不会用空值去 cp。
          DATE="${{ steps.analysis.outputs.data_date }}"
          [ -n "$DATE" ] || DATE=$(date +%F)
          YEAR=$(date -d "$DATE" +%Y)
          MONTH=$(date -d "$DATE" +%m)
          echo "📅 归档数据日期: ${DATE}"

          # 创建归档目录
          mkdir -p "reports/daily/${YEAR}/${MONTH}"

          # 归档基础日报
          if [ -f "reports/report_${DATE}.md" ]; then
            cp "reports/report_${DATE}.md" "reports/daily/${YEAR}/${MONTH}/"
            git add "reports/daily/${YEAR}/${MONTH}/report_${DATE}.md"
          fi

          # 归档 yyPZ 报告
          if [ -f "reports/yypz_${DATE}.md" ]; then
            cp "reports/yypz_${DATE}.md" "reports/daily/${YEAR}/${MONTH}/"
            git add "reports/daily/${YEAR}/${MONTH}/yypz_${DATE}.md"
          fi

          # 归档郑希研报
          if [ -f "reports/zhengxi_${DATE}.md" ]; then
            cp "reports/zhengxi_${DATE}.md" "reports/daily/${YEAR}/${MONTH}/"
            git add "reports/daily/${YEAR}/${MONTH}/zhengxi_${DATE}.md"
          fi

          # 归档完整合编
          if [ -f "reports/full_${DATE}.md" ]; then
            cp "reports/full_${DATE}.md" "reports/daily/${YEAR}/${MONTH}/"
            git add "reports/daily/${YEAR}/${MONTH}/full_${DATE}.md"
          fi

          # 提交所有更改（包括新策略代码、配置变更等）
          git add -A
          if git diff --quiet && git diff --staged --quiet; then
            echo "⏭️ 无新内容可提交"
          else
            git commit -m "📁 归档日报 ${DATE}"
            git push
            echo "✅ 已推送到仓库"
          fi

      - name: 💾 保存报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-report-${{ github.run_number }}
          path: reports/
          retention-days: 30
