# ============================================
# A股全自动分析 - GitHub Actions 定时任务
# 每个工作日下午 18:00（北京时间）推送一次，内容 = 当天收盘复盘
#   UTC 10:00 = 北京时间 18:00
# 整合：基础技术分析 + yyPZ老龙反抽 + 股票推送
# ============================================

name: Daily Stock Analysis

concurrency:
  group: daily-stock-analysis
  cancel-in-progress: false

on:
  schedule:
    # UTC 10:00 = 北京时间 18:00；周一~周五
    - cron: '0 10 * * 1-5'

  # 支持手动触发
  workflow_dispatch:

  # 推送代码时运行（用于调试）
  push:
    branches:
      - main
    paths:
      - '**.py'
      - 'config.json'
      - 'config.yaml'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # 统一锁北京时区，确保 Python、shell 和归档日期一致。
    env:
      TZ: Asia/Shanghai

    steps:
      - name: 📥 拉取代码
        uses: actions/checkout@v4

      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📊 运行全分析（基础分析 + yyPZ + 股票推送）
        id: analysis
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          PUSH_TRIGGER: ${{ github.event_name }}
          # 定时任务真的推送；改代码顺带触发的那次只生成不推送 ——
          # 推送时段说好了是早上 6 点，晚上改一版排版不该在你手机上也响一声。
          PUSH_DRY_RUN: ${{ github.event_name == 'push' && '1' || '0' }}
        run: python run_daily.py

      - name: 📁 归档报告到仓库
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git config user.name "stock-analyzer[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 文件是按行情数据日期命名的（≈ 昨天），不是运行日期；run_daily.py 把它
          # 透到这一步的 output 里。脚本中途挂了就退回今天，至少不会用空值去 cp。
          DATE="${{ steps.analysis.outputs.data_date }}"
          [ -n "$DATE" ] || DATE=$(date +%F)
          YEAR=$(date -d "$DATE" +%Y)
          MONTH=$(date -d "$DATE" +%m)
          echo "📅 归档数据日期: ${DATE}"

          # 创建归档目录
          mkdir -p "reports/daily/${YEAR}/${MONTH}"

          # 归档基础日报
          if [ -f "reports/report_${DATE}.md" ]; then
            cp "reports/report_${DATE}.md" "reports/daily/${YEAR}/${MONTH}/"
            git add "reports/daily/${YEAR}/${MONTH}/report_${DATE}.md"
          fi

          # 归档 yyPZ 报告
          if [ -f "reports/yypz_${DATE}.md" ]; then
            cp "reports/yypz_${DATE}.md" "reports/daily/${YEAR}/${MONTH}/"
            git add "reports/daily/${YEAR}/${MONTH}/yypz_${DATE}.md"
          fi

          # 归档完整合编
          if [ -f "reports/full_${DATE}.md" ]; then
            cp "reports/full_${DATE}.md" "reports/daily/${YEAR}/${MONTH}/"
            git add "reports/daily/${YEAR}/${MONTH}/full_${DATE}.md"
          fi

          # 提交所有更改（包括新策略代码、配置变更等）
          git add -A
          if git diff --quiet && git diff --staged --quiet; then
            echo "⏭️ 无新内容可提交"
          else
            git commit -m "📁 归档日报 ${DATE}"
            # 直接 push 会被拒：run 是照触发时的 sha 拉下来的，这期间只要有人推过
            # （本地手动推、或两次运行重叠），远端就已经往前走了。先 rebase 再推。
            git pull --rebase --autostash origin main
            git push
            echo "✅ 已推送到仓库"
          fi

      - name: 💾 保存报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-report-${{ github.run_number }}
          path: reports/
          retention-days: 30
